# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Guidelines for Design·AI Education
# email: setsuko_yokoyama@sutd.edu.sg
description: Guidelines for Design·AI Education at Singapore University of Technology and Design (SUTD), prepared by the Design·AI Education Task Force.
keywords: "Design AI, AI education, SUTD, Singapore, pedagogy, critical AI literacy, design thinking, engineering, higher education, generative AI, teaching and learning"
url: "https://design-ai-education.info"
baseurl: ""
# twitter_username: jekyllrb
# github_username:  jekyll

# Build settings
theme: just-the-docs
plugins:
  - jekyll-feed
  - jekyll-sitemap

# Custom settings
color_scheme: light
aux_links:
custom_css:
  - "/assets/css/custom.css"
logo: "/assets/images/octopus.png"
favicon_ico: "/assets/images/octopus.png"

